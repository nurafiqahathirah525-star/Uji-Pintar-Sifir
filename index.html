<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>PINTAR SIFIR by TZ EDU KIDS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 32%),
        radial-gradient(circle at top right, #f3e8ff 0, transparent 30%),
        linear-gradient(135deg, #eff6ff, #faf5ff);
      color: #1e293b;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    .answer-button {
      transition: transform .12s ease;
    }

    .answer-button:active {
      transform: scale(.97);
    }

    .no-select {
      user-select: none;
    }

    .confetti {
      position: fixed;
      top: -30px;
      z-index: 9999;
      pointer-events: none;
      animation: jatuh linear forwards;
    }

    @keyframes jatuh {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes berdenyut {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .pulse {
      animation: berdenyut 1.5s infinite;
    }

    @media print {
      body {
        background: white !important;
      }

      .jangan-cetak {
        display: none !important;
      }

      .sijil-cetak {
        display: flex !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      useState,
      useEffect,
      useRef
    } = React;

    const JADUAL = Array.from({ length: 11 }, (_, i) => i + 2);
    const PENDEDAH_BIASA = Array.from({ length: 12 }, (_, i) => i + 1);
    const PENDEDAH_JUARA = Array.from({ length: 11 }, (_, i) => i + 2);

    const WARNA_SIFIR = [
      "bg-blue-500",
      "bg-purple-500",
      "bg-green-500",
      "bg-yellow-500",
      "bg-pink-500",
      "bg-indigo-500",
      "bg-cyan-500",
      "bg-emerald-500",
      "bg-violet-500",
      "bg-rose-500",
      "bg-sky-500"
    ];

    const LABEL_PENCAPAIAN = {
      langkah: {
        nama: "Langkah Pertama",
        ikon: "🌱",
        penerangan: "Jawab soalan pertama"
      },
      hebat: {
        nama: "Hebat!",
        ikon: "🌟",
        penerangan: "Dapat 100% dalam satu sifir"
      },
      lima: {
        nama: "5 Sifir",
        ikon: "🔥",
        penerangan: "Kuasai 5 sifir"
      },
      lengkap: {
        nama: "Lengkap!",
        ikon: "🏅",
        penerangan: "Kuasai semua sifir 2 hingga 12"
      },
      tahap400: {
        nama: "Naik Tahap",
        ikon: "🚀",
        penerangan: "Capai 400 mata"
      },
      tahap800: {
        nama: "Makin Mahir",
        ikon: "🔥",
        penerangan: "Capai 800 mata"
      },
      tahap1200: {
        nama: "Juara Sifir",
        ikon: "🏆",
        penerangan: "Capai 1,200 mata"
      },
      penuh: {
        nama: "Juara Sifir 1,600",
        ikon: "⭐",
        penerangan: "Capai 1,600 mata"
      },
      streak3: {
        nama: "Konsisten",
        ikon: "🔥",
        penerangan: "Berlatih 3 hari berturut-turut"
      },
      streak7: {
        nama: "Luar Biasa!",
        ikon: "🌟",
        penerangan: "Berlatih 7 hari berturut-turut"
      },
      juara: {
        nama: "Cabaran Juara",
        ikon: "🏆",
        penerangan: "Lengkapkan Cabaran Juara"
      }
    };

    function campur(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function binaSoalanSifir(sifir) {
      const pendedah = campur(PENDEDAH_BIASA).slice(0, 10);

      return pendedah.map(n => ({
        a: n,
        b: sifir,
        jawapan: n * sifir
      }));
    }

    function binaSoalanJuara() {
      const semua = [];

      for (const sifir of JADUAL) {
        for (const n of PENDEDAH_JUARA) {
          semua.push({
            a: n,
            b: sifir,
            jawapan: n * sifir
          });
        }
      }

      return campur(semua).slice(0, 50);
    }

    function binaPilihan(jawapan) {
      const pilihan = new Set([jawapan]);

      while (pilihan.size < 4) {
        const beza = Math.floor(Math.random() * 11) + 1;
        const tanda = Math.random() > 0.5 ? 1 : -1;
        const calon = jawapan + (beza * tanda);

        if (calon > 0 && calon !== jawapan) {
          pilihan.add(calon);
        }
      }

      return campur([...pilihan]);
    }

    function dapatTahap(mata) {
      if (mata >= 1200) return "JUARA SIFIR";
      if (mata >= 800) return "MAHIR";
      if (mata >= 400) return "PERTENGAHAN";
      return "PEMULA";
    }

    function ikonTahap(mata) {
      if (mata >= 1200) return "🏆";
      if (mata >= 800) return "🔥";
      if (mata >= 400) return "⭐";
      return "🌱";
    }

    function mataTahapSeterusnya(mata) {
      if (mata < 400) return 400;
      if (mata < 800) return 800;
      if (mata < 1200) return 1200;
      return 1600;
    }

    function dapatBintang(markah) {
      if (markah === 100) return 3;
      if (markah >= 80) return 2;
      if (markah >= 50) return 1;
      return 0;
    }

    function lancarkanConfetti() {
      const ikon = ["⭐", "✨", "🎉", "💫", "🌟", "🎊"];

      for (let i = 0; i < 45; i++) {
        const el = document.createElement("div");

        el.className = "confetti";
        el.textContent = ikon[Math.floor(Math.random() * ikon.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (14 + Math.random() * 18) + "px";
        el.style.animationDuration = (2 + Math.random() * 3) + "s";
        el.style.animationDelay = Math.random() * .5 + "s";

        document.body.appendChild(el);

        setTimeout(() => el.remove(), 5500);
      }
    }

    // =========================
    // BUNYI
    // =========================

    let audioContext = null;
    let muzikInterval = null;

    function dapatAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    function bunyiNada(frekuensi, tempoh = .12, jenis = "sine") {
      try {
        const ctx = dapatAudio();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = jenis;
        osc.frequency.value = frekuensi;

        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.08, ctx.currentTime + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + tempoh);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + tempoh);
      } catch (e) {}
    }

    function bunyiBetul() {
      bunyiNada(660, .10);
      setTimeout(() => bunyiNada(880, .14), 80);
    }

    function bunyiSalah() {
      bunyiNada(220, .18, "triangle");
    }

    function bunyiSelesai() {
      bunyiNada(523, .12);
      setTimeout(() => bunyiNada(659, .12), 100);
      setTimeout(() => bunyiNada(784, .20), 200);
    }

    function bunyiNaikTahap() {
      bunyiNada(523, .12);
      setTimeout(() => bunyiNada(659, .12), 100);
      setTimeout(() => bunyiNada(784, .12), 200);
      setTimeout(() => bunyiNada(1046, .25), 300);
    }

    // Muzik latar ringkas yang lembut
    function mulaMuzik() {
      try {
        const ctx = dapatAudio();

        if (muzikInterval) return;

        const nota = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
        let indeks = 0;

        const mainNota = () => {
          if (!audioContext) return;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sine";
          osc.frequency.value = nota[indeks];

          gain.gain.setValueAtTime(.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.018, ctx.currentTime + .05);
          gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .45);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + .5);

          indeks = (indeks + 1) % nota.length;
        };

        mainNota();
        muzikInterval = setInterval(mainNota, 550);
      } catch (e) {}
    }

    function hentikanMuzik() {
      if (muzikInterval) {
        clearInterval(muzikInterval);
        muzikInterval = null;
      }
    }

    // =========================
    // APLIKASI
    // =========================

    function App() {
      const [paparan, setPaparan] = useState("utama");

      const [nama, setNama] = useState(
        localStorage.getItem("ps_name") || ""
      );

      const [namaInput, setNamaInput] = useState(
        localStorage.getItem("ps_name") || ""
      );

      const [penguasaan, setPenguasaan] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("ps_mastery")) || {};
        } catch {
          return {};
        }
      });

      const [mataJuara, setMataJuara] = useState(
        Number(localStorage.getItem("ps_championPoints") || 0)
      );

      const [syiling, setSyiling] = useState(
        Number(localStorage.getItem("ps_coins") || 0)
      );

      const [pencapaian, setPencapaian] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("ps_achievements")) || [];
        } catch {
          return [];
        }
      });

      const [streak, setStreak] = useState(
        Number(localStorage.getItem("ps_streak") || 0)
      );

      const [bunyiAktif, setBunyiAktif] = useState(
        localStorage.getItem("ps_sound") !== "false"
      );

      const [muzikAktif, setMuzikAktif] = useState(
        localStorage.getItem("ps_music") !== "false"
      );

      const [sifirDipilih, setSifirDipilih] = useState(null);
      const [soalan, setSoalan] = useState([]);
      const [indeksSoalan, setIndeksSoalan] = useState(0);
      const [mata, setMata] = useState(0);
      const [masa, setMasa] = useState(60);
      const [modPermainan, setModPermainan] = useState("sifir");
      const [jawapanDipilih, setJawapanDipilih] = useState(null);
      const [keputusan, setKeputusan] = useState(null);
      const [sedangJawab, setSedangJawab] = useState(false);

      const tamatRef = useRef(false);

      const jumlahMataSifir = Object.values(penguasaan)
        .reduce((jumlah, nilai) => jumlah + Number(nilai || 0), 0);

      const jumlahMata = jumlahMataSifir + mataJuara;

      const tahap = dapatTahap(jumlahMata);
      const ikon = ikonTahap(jumlahMata);

      const semuaSifirSiap = JADUAL.every(
        sifir => Number(penguasaan[sifir] || 0) >= 100
      );

      // =========================
      // SIMPAN DATA
      // =========================

      useEffect(() => {
        localStorage.setItem("ps_mastery", JSON.stringify(penguasaan));
      }, [penguasaan]);

      useEffect(() => {
        localStorage.setItem("ps_championPoints", mataJuara);
      }, [mataJuara]);

      useEffect(() => {
        localStorage.setItem("ps_coins", syiling);
      }, [syiling]);

      useEffect(() => {
        localStorage.setItem("ps_achievements", JSON.stringify(pencapaian));
      }, [pencapaian]);

      useEffect(() => {
        localStorage.setItem("ps_streak", streak);
      }, [streak]);

      useEffect(() => {
        localStorage.setItem("ps_sound", bunyiAktif);
      }, [bunyiAktif]);

      useEffect(() => {
        localStorage.setItem("ps_music", muzikAktif);
      }, [muzikAktif]);

      // =========================
      // MUZIK KEKAL SEPANJANG APP
      // =========================

      function aktifkanAudio() {
        try {
          dapatAudio();

          if (muzikAktif) {
            mulaMuzik();
          }
        } catch (e) {}
      }

      function tukarMuzik() {
        aktifkanAudio();

        setMuzikAktif(sebelum => {
          const baru = !sebelum;

          if (baru) {
            setTimeout(() => mulaMuzik(), 50);
          } else {
            hentikanMuzik();
          }

          return baru;
        });
      }

      useEffect(() => {
        return () => hentikanMuzik();
      }, []);

      // =========================
      // PENCAPAIAN
      // =========================

      function tambahPencapaian(kunci) {
        if (!LABEL_PENCAPAIAN[kunci]) return;

        if (!pencapaian.includes(kunci)) {
          setPencapaian(prev => [...prev, kunci]);

          setTimeout(() => {
            if (bunyiAktif) bunyiSelesai();
            lancarkanConfetti();
          }, 100);
        }
      }

      function semakPencapaian(mataKeseluruhan, penguasaanBaru, streakBaru) {
        if (mataKeseluruhan > 0) {
          tambahPencapaian("langkah");
        }

        const bilanganLengkap = JADUAL.filter(
          s => Number(penguasaanBaru[s] || 0) >= 100
        ).length;

        if (bilanganLengkap >= 5) tambahPencapaian("lima");
        if (bilanganLengkap === 11) tambahPencapaian("lengkap");

        if (mataKeseluruhan >= 400) tambahPencapaian("tahap400");
        if (mataKeseluruhan >= 800) tambahPencapaian("tahap800");
        if (mataKeseluruhan >= 1200) tambahPencapaian("tahap1200");
        if (mataKeseluruhan >= 1600) tambahPencapaian("penuh");

        if (streakBaru >= 3) tambahPencapaian("streak3");
        if (streakBaru >= 7) tambahPencapaian("streak7");
      }

      // =========================
      // STREAK
      // =========================

      function kemasKiniStreak() {
        const hariIni = new Date().toISOString().slice(0, 10);
        const hariLama = localStorage.getItem("ps_lastPractice");

        let baru = 1;

        if (hariLama === hariIni) {
          baru = streak || 1;
        } else if (hariLama) {
          const tarikhLama = new Date(hariLama);
          const tarikhHariIni = new Date(hariIni);

          const beza = Math.round(
            (tarikhHariIni - tarikhLama) / 86400000
          );

          if (beza === 1) {
            baru = (streak || 0) + 1;
          } else {
            baru = 1;
          }
        }

        setStreak(baru);
        localStorage.setItem("ps_lastPractice", hariIni);

        return baru;
      }

      // =========================
      // MULA PERMAINAN
      // =========================

      function mulaSifir(sifir) {
        aktifkanAudio();

        setSifirDipilih(sifir);

        if (!nama.trim()) {
          setPaparan("nama");
          return;
        }

        const soalanBaru = binaSoalanSifir(sifir);

        setSoalan(soalanBaru);
        setIndeksSoalan(0);
        setMata(0);
        setMasa(60);
        setModPermainan("sifir");
        setJawapanDipilih(null);
        setKeputusan(null);
        tamatRef.current = false;
        setPaparan("kuiz");
      }

      function mulaCabaranJuara() {
        aktifkanAudio();

        if (!semuaSifirSiap) return;

        if (!nama.trim()) {
          setPaparan("nama");
          return;
        }

        const soalanBaru = binaSoalanJuara();

        setSoalan(soalanBaru);
        setIndeksSoalan(0);
        setMata(0);
        setMasa(180);
        setModPermainan("juara");
        setJawapanDipilih(null);
        setKeputusan(null);
        tamatRef.current = false;
        setPaparan("kuiz");
      }

      // =========================
      // SIMPAN NAMA
      // =========================

      function simpanNama() {
        const namaBersih = namaInput.trim();

        if (!namaBersih) return;

        localStorage.setItem("ps_name", namaBersih);
        setNama(namaBersih);

        aktifkanAudio();

        if (sifirDipilih) {
          const soalanBaru = binaSoalanSifir(sifirDipilih);

          setSoalan(soalanBaru);
          setIndeksSoalan(0);
          setMata(0);
          setMasa(60);
          setModPermainan("sifir");
          setJawapanDipilih(null);
          setKeputusan(null);
          tamatRef.current = false;
          setPaparan("kuiz");
        } else if (modPermainan === "juara") {
          const soalanBaru = binaSoalanJuara();

          setSoalan(soalanBaru);
          setIndeksSoalan(0);
          setMata(0);
          setMasa(180);
          setJawapanDipilih(null);
          setKeputusan(null);
          tamatRef.current = false;
          setPaparan("kuiz");
        } else {
          setPaparan("utama");
        }
      }

      // =========================
      // JAM
      // =========================

      useEffect(() => {
        if (paparan !== "kuiz") return;

        if (masa <= 0) {
          tamatPermainan();
          return;
        }

        const pemasa = setTimeout(() => {
          setMasa(m => m - 1);
        }, 1000);

        return () => clearTimeout(pemasa);
      }, [paparan, masa]);

      // =========================
      // JAWAPAN
      // =========================

      function pilihJawapan(nilai) {
        if (sedangJawab || tamatRef.current) return;

        setSedangJawab(true);
        setJawapanDipilih(nilai);

        const soalanSemasa = soalan[indeksSoalan];
        const betul = nilai === soalanSemasa.jawapan;

        if (betul) {
          if (bunyiAktif) bunyiBetul();
          setKeputusan("betul");
          setMata(prev => prev + 1);
          setSyiling(prev => prev + 5);
        } else {
          if (bunyiAktif) bunyiSalah();
          setKeputusan("salah");
        }

        setTimeout(() => {
          if (indeksSoalan >= soalan.length - 1) {
            tamatPermainan(betul ? 1 : 0);
          } else {
            setIndeksSoalan(prev => prev + 1);
            setJawapanDipilih(null);
            setKeputusan(null);
            setSedangJawab(false);
          }
        }, 650);
      }

      // =========================
      // TAMAT PERMAINAN
      // =========================

      function tamatPermainan(tambahanBetul = 0) {
        if (tamatRef.current) return;

        tamatRef.current = true;
        setSedangJawab(true);

        let mataAkhir = mata + tambahanBetul;

        if (mataAkhir > soalan.length) {
          mataAkhir = soalan.length;
        }

        const mataDiperoleh = mataAkhir * 10;
        const markah = soalan.length
          ? Math.round((mataAkhir / soalan.length) * 100)
          : 0;

        let penguasaanBaru = { ...penguasaan };
        let mataJuaraBaru = mataJuara;

        if (modPermainan === "sifir") {
          const lama = Number(penguasaan[sifirDipilih] || 0);

          if (mataDiperoleh > lama) {
            penguasaanBaru[sifirDipilih] = mataDiperoleh;
            setPenguasaan(penguasaanBaru);
          }
        } else {
          if (mataDiperoleh > mataJuara) {
            mataJuaraBaru = mataDiperoleh;
            setMataJuara(mataJuaraBaru);
          }

          if (mataDiperoleh > 0) {
            tambahPencapaian("juara");
          }
        }

        const streakBaru = kemasKiniStreak();

        const jumlahSifirBaru = Object.values(penguasaanBaru)
          .reduce((jumlah, nilai) => jumlah + Number(nilai || 0), 0);

        const jumlahBaru = jumlahSifirBaru + mataJuaraBaru;

        const tahapSebelum = dapatTahap(jumlahMata);
        const tahapSelepas = dapatTahap(jumlahBaru);

        if (tahapSebelum !== tahapSelepas) {
          setTimeout(() => {
            if (bunyiAktif) bunyiNaikTahap();
            lancarkanConfetti();
          }, 200);
        }

        if (markah === 100) {
          tambahPencapaian("hebat");
        }

        semakPencapaian(
          jumlahBaru,
          penguasaanBaru,
          streakBaru
        );

        if (jumlahBaru >= 1200) {
          setTimeout(() => lancarkanConfetti(), 250);
        }

        if (jumlahBaru === 1600) {
          setTimeout(() => lancarkanConfetti(), 500);
        }

        if (bunyiAktif) {
          setTimeout(() => bunyiSelesai(), 300);
        }

        setMata(mataAkhir);

        setPaparan("keputusan");
      }

      // =========================
      // RESET
      // =========================

      function resetKemajuan() {
        const yakin = window.confirm(
          "Adakah anda pasti mahu padam semua kemajuan PINTAR SIFIR?"
        );

        if (!yakin) return;

        localStorage.removeItem("ps_mastery");
        localStorage.removeItem("ps_championPoints");
        localStorage.removeItem("ps_coins");
        localStorage.removeItem("ps_achievements");
        localStorage.removeItem("ps_streak");
        localStorage.removeItem("ps_lastPractice");

        setPenguasaan({});
        setMataJuara(0);
        setSyiling(0);
        setPencapaian([]);
        setStreak(0);

        setPaparan("utama");
      }

      // =========================
      // BUTANG AUDIO
      // =========================

      function ButangAudio() {
        return (
          <div className="flex gap-2">
            <button
              onClick={() => {
                aktifkanAudio();

                setBunyiAktif(prev => !prev);
              }}
              className="bg-white/90 rounded-full px-3 py-2 shadow text-sm font-bold"
              aria-label="Bunyi"
            >
              {bunyiAktif ? "🔊" : "🔇"}
            </button>

            <button
              onClick={tukarMuzik}
              className="bg-white/90 rounded-full px-3 py-2 shadow text-sm font-bold"
